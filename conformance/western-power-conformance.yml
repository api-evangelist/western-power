- id: hsts-rfc6797
  conforms: true
  evidence: >-
    strict-transport-security max-age=31536000; includeSubDomains; preload on
    www.westernpower.com.au and www.mywpprojects.westernpower.com.au.
- id: esri-arcgis-rest
  conforms: true
  evidence: >-
    WP_Outage_Prod FeatureServer is a standard ArcGIS REST service — ?f=json
    self-description, Query capability, resultOffset/resultRecordCount pagination,
    esriSpatialRel* filters, and the {"error":{code,message,details}} envelope.
- id: geojson-rfc7946
  conforms: true
  evidence: >-
    Layer 0 supportedQueryFormats is "JSON, geoJSON, PBF"; DataWA publishes GeoJSON
    distributions for the catalogued network datasets.
- id: ogc-wfs
  conforms: true
  evidence: >-
    The DataWA/SLIP resources for Western Power datasets include OGC WFS endpoints
    (catalog/datawa-wp-031-distribution-overhead-powerlines.json). Authentication
    required — anonymous calls return 401.
- id: ogc-wms
  conforms: true
  evidence: OGC WMS endpoints published alongside WFS on the same SLIP services.
- id: iso8601
  conforms: partial
  evidence: >-
    Outage timestamps use ISO 8601 BASIC format (20260728T190000+08:00) rather than
    the RFC 3339 extended profile; the vacancies feed uses RFC 3339. Inconsistent
    across endpoints.
- id: cdr-consumer-data-standards-energy
  conforms: false
  evidence: >-
    Out of scope, not merely unimplemented. CDR energy designates NEM retailers with
    AEMO as gateway; Western Australia sits outside the National Electricity Market
    and distributors were never designated data holders. See review.yml mandate.
