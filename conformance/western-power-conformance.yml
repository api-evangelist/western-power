- id: openid-connect
  conforms: false
  evidence: /.well-known/openid-configuration returned 404 on every host probed.
- id: rfc9116-security-txt
  conforms: false
  evidence: /.well-known/security.txt returned 404 on every Western Power host.
- id: rfc9727-api-catalog
  conforms: false
