compliance_program:
  published: false
  certifications: []
  detail: >-
    No trust centre, no SOC 2 / ISO 27001 / PCI DSS claim, and no security
    certifications page. probe-security-programs.py found no vulnerability
    disclosure programme and no trust centre on 2026-07-27. As a WA state-owned
    statutory corporation, Western Power's assurance obligations run to the WA
    Government and the Economic Regulation Authority, not to a public trust page.
    No `Compliance` pointer is emitted, because nothing is published.
regulatory:
  instrument: Electricity Industry (Metering) Code 2012 (Western Australia)
  administrator: Economic Regulation Authority (ERA) of Western Australia
  api_relevance: >-
    A real, in-force data-provision duty that specifies no interface. Discharged
    with a web form, a consent form and delivery by email or web portal. See
    review.yml secondaryObligation.
