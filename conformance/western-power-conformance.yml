generated: '2026-07-27'
method: derived
source: >-
  openapi/ (three API Evangelist-derived descriptions), arcgis/ service metadata,
  catalog/ DataWA CKAN records, and live probes 2026-07-27.
summary: >-
  The only standards genuinely in play are geospatial and vendor conventions. No
  energy data standard, no identity standard, no API-design standard and no
  published compliance certification was found anywhere in the estate.
standards:
- id: openapi-3
