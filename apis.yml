apis:
- aid: western-power:western-power-outage-areas-feature-service
  name: Western Power Outage Areas Feature Service
  description: Live outage data for the South West Interconnected System, served as
    an Esri ArcGIS Online hosted feature service (layer 0, "Outage_Areas") that backs
    the public Western Power outage tracker at westernpower.com.au/outages/. Western
    Power does not document or advertise this as an API, but the service answers
    anonymous unauthenticated requests (verified HTTP 200 on 2026-07-27), is
    self-describing via the standard ArcGIS REST `?f=json` metadata convention, and
    supports the Query capability with a 2,000-record page size. Each outage polygon
    carries OUTAGETYPE, INCIDENTREF, ENARNUMBER, OUTAGESTARTTIME,
    ESTIMATEDRESTORATIONTIME, PLANNEDOUTAGE, NOCUSTOMERSIMPACTED, TIMEADDED,
    AFFECTED_AREA and AFFECTED_AREA_NOCUSTOMERS. No API key, token or registration is
    required; equally, no support, SLA, terms of use or deprecation policy is
    published for it.
  humanURL: https://www.westernpower.com.au/outages/
  baseURL: https://services2.arcgis.com/tBLxde4cxSlNUxsM/ArcGIS/rest/services/WP_Outage_Prod/FeatureServer
  tags:
  - Outages
  - Grid
  - GeoJSON
  - ArcGIS
  - Real Time
  properties:
  - type: ServiceMetadata
    url: arcgis/wp-outage-featureserver.json
  - type: ServiceMetadata
    url: arcgis/wp-outage-layer0-outage-areas.json
  - type: SampleResponse
    url: arcgis/wp-outage-sample-query-response.json
  - type: Documentation
    url: https://www.westernpower.com.au/outages/
- aid: western-power:western-power-public-secure-services-slip
  name: Western Power Public Secure Services (SLIP)
  description: Western Power's network asset and capacity spatial data — distribution
    and transmission overhead powerlines, underground cables, poles, pillars, pits,
    transformers, enclosures, substations, streetlights, underground power project
    areas and the Network Capacity Mapping Tool forecast remaining-capacity layers —
    published as 36 datasets on the WA Government DataWA catalogue and served from
    the Landgate SLIP platform as ArcGIS REST MapServer/FeatureServer, OGC WFS and
    OGC WMS endpoints plus GeoJSON, GeoPackage, File Geodatabase and Shapefile
    downloads. DataWA labels these "open data subject to registering for access";
    access is automatically granted on registering an email address and agreeing to
    Western Power's data licence terms and conditions. Anonymous calls are rejected —
    both the MapServer root and layer 10 returned HTTP 401 Unauthorized on 2026-07-27,
    and the bulk download host redirects to /Account/Login. Authenticated access uses
    Esri token authentication via token.slip.wa.gov.au.
  humanURL: https://catalogue.data.wa.gov.au/dataset/distribution-overhead-power-lines-wp-031
  baseURL: https://services.slip.wa.gov.au/arcgis/rest/services/WP_Public_Secure_Services/WP_Public_Secure_Services/MapServer
  tags:
  - Open Data
  - GIS
  - Grid
  - Network Capacity
  - WFS
