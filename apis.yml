- aid: western-power:western-power-corporate-web-api
  name: Western Power Corporate Web API
  description: The anonymous read endpoints behind westernpower.com.au itself — site
    search, the news article feed and the careers vacancy feed. These are internal
    endpoints of the Optimizely/EPiServer corporate site, declared in the site's own
    JavaScript bundle and reachable without authentication (verified HTTP 200 on
    2026-07-27). /api/search is backed by Optimizely Find and returns paged hits, a
    did-you-mean suggestion, content-type facets and — unusually — an embedded suburb
    outage rollup so a search box can surface outage status inline. /api/corp/vacancies
    and /api/corp/newsarticles serve the careers and newsroom listings. robots.txt
    disallows /api/, and Western Power publishes no documentation, terms of use or SLA
    for these endpoints. The OpenAPI below was derived by API Evangelist from live
    probes and from parameter names read out of the site's client bundle.
  humanURL: https://www.westernpower.com.au/
  baseURL: https://www.westernpower.com.au/api
