apis:
- aid: western-power:western-power-public-secure-services-slip
  name: Western Power Public Secure Services (SLIP)
  description: >-
    Western Power's network asset and capacity spatial data — distribution and transmission overhead powerlines,
    underground cables, poles, pillars, pits, transformers, enclosures, substations, streetlights, underground
    power project areas and the Network Capacity Mapping Tool forecast remaining-capacity layers — published
    as 36 datasets on the WA Government DataWA catalogue and served from the Landgate SLIP platform as
    ArcGIS REST MapServer/FeatureServer, OGC WFS and OGC WMS endpoints plus GeoJSON, GeoPackage, File
    Geodatabase and Shapefile downloads. DataWA labels these "open data subject to registering for access";
    access is automatically granted on registering an email address and agreeing to Western Power's data
    licence terms and conditions. Anonymous calls are rejected — both the MapServer root and layer 10
    returned HTTP 401 Unauthorized on 2026-07-27, and the bulk download host redirects to /Account/Login.
    Authenticated access uses Esri token authentication via token.slip.wa.gov.au.
  humanURL: https://catalogue.data.wa.gov.au/dataset/distribution-overhead-power-lines-wp-031
  baseURL: >-
    https://services.slip.wa.gov.au/arcgis/rest/services/WP_Public_Secure_Services/WP_Public_Secure_Services/MapServer
  tags:
  - Open Data
  - GIS
  - Grid
  - Network Capacity
  - WFS
