apis:
- aid: western-power:western-power-outage-web-api
  name: Western Power Outage Web API
  description: The undocumented first-party JSON API behind the public Western Power
    outage tracker. The outage page declares its own endpoints in markup —
    all-outages-endpoint="/api/corp/outage/all-outages" and
    single-outage-endpoint="/api/corp/outage/details/" — and all three operations
    answer anonymous unauthenticated HTTPS GET with application/json (verified HTTP
    200 on 2026-07-27). listAllOutages returns every current and upcoming outage as a
    bare unpaginated array (211 records, 61 KB observed) with incident reference,
    planned/unplanned type, start and estimated restoration times, customers impacted,
    affected suburbs and a centroid. getOutageDetails adds an update history and
    bushfire, total-fire-ban, weather and fire-weather-warning hazard flags, answering
    an unknown identifier with HTTP 204 rather than 404. getSuburbOutageStatus returns
    a per-suburb rollup and never signals an error. Western Power publishes no
    reference, no terms of use, no versioning, no rate limits, no SLA and no support
    channel for any of it, and robots.txt disallows /api/ to crawlers. The OpenAPI
    below was derived by API Evangelist from live probes, not published by the
    provider.
  humanURL: https://www.westernpower.com.au/outages/
  baseURL: https://www.westernpower.com.au/api/corp/outage
