findings:
  developerPortal: none
  developerPortalConfirmed: false
  apisListed: 2
  gated: true
  notes: >-
    Western Power is the control case's control case. Australia proved a statutory
    data mandate is transplantable — the CDR moved from banking into energy with the
    same regulator, the same Data Standards Body and AEMO as gateway — and this
    organisation shows the precise shape of the hole that transplant left. It is an
    Australian energy business that the Australian energy data mandate does not touch,
    because CDR energy binds retailers inside the National Electricity Market and
    Western Power is a distributor outside it. What fills the vacuum is instructive: a
    state metering code that obliges data provision but specifies no interface, so the
    duty is met by a consent form and a web portal; an "open data" program whose
    openness stops at a login; and the only real machine-readable surface arriving by
    accident, as the undocumented ArcGIS service behind a public outage map.

