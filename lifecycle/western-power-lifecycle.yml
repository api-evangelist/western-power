  detail: >-
    No version in the path, header or query for /api/corp/outage/*. The client
    bundle references /api/corp/v2/ and /api/corp/v3/ prefixes for other
    (authenticated) endpoints, which shows an internal convention that has not been
    applied to the public surface. The corporate site emits build number 2026.7.7.1
    in an HTML comment. ArcGIS reports platform currentVersion 12.
