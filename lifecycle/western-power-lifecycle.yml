summary: >-
  There is no API lifecycle. No versioning scheme, no deprecation policy, no sunset
  signalling, no changelog, no status page for the endpoints, no SLA and no support
  channel. Every surface here is an implementation detail of a web application that
  Western Power can change or remove without notice, and nothing obliges them to
  announce it.
